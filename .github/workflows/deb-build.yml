name: Debian build
on:
  pull_request:
    paths: [requirements.in, requirements.txt, debian/**, setup.py]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    container: debian:${{ matrix.debian }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper dh-virtualenv sudo python3 python3-setuptools python3-pip python3-venv
      - run: dpkg-buildpackage -uc -us -tc -b
